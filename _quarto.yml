project:
  type: website

website:
  title: "linkedmice"
  repo-url: https://github.com/CentroFuturoCiudades/linkedmice
  repo-actions: [edit, source, issue]
  navbar:
    search: false
    tools:
      - icon: github
        menu:
        - text: Source Code
          href: https://github.com/CentroFuturoCiudades/linkedmice
          target: _blank
        - text: Start an issue
          href: https://github.com/CentroFuturoCiudades/linkedmice/issues
          target: _blank
  sidebar:
    style: "docked"
    search: true
    contents: auto

format:
  html:
    theme:
      - cosmo
    toc: true
    code-fold: false
    code-tools: false
    toc-depth: 4
    toc-expand: true

jupyter: python3

execute:
  echo: true
  freeze: true
  eval: false

data: last-modified
